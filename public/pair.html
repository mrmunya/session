<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.catbox.moe/c7eilp.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARINYAME TECH| PAIRING CODE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a855f7;
            --primary-dark: #5b21b6;
            --accent: #06b6d4;
            --accent-glow: #22d3ee;
            --text: #ffffff;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --background: #000000;
            --card-bg: #111111;
            --input-bg: #1a1a1a;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: rgba(124, 58, 237, 0.3);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.6;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .home-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(37, 211, 102, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(37, 211, 102, 0.4);
            color: var(--text);
            padding: 0.75rem 1.4rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .home-btn i {
            color: #25D366;
            font-size: 1.1rem;
        }

        .home-btn:hover {
            background: rgba(37, 211, 102, 0.3);
            border-color: rgba(37, 211, 102, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1;
            margin-top: 60px;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
        }

        h1 {
            color: var(--text);
            margin-bottom: 0.5rem;
            font-size: clamp(1.8rem, 4vw, 2.2rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
            white-space: nowrap;
        }

        h1 .gradient-text {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        label i {
            color: var(--primary-light);
            font-size: 0.85rem;
        }

        .input-container {
            position: relative;
        }

        .input-container i.input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            transition: var(--transition);
            pointer-events: none;
        }

        .input-prefix {
            position: absolute;
            left: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 16px 16px 70px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            background-color: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: var(--transition);
            letter-spacing: 0.5px;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0;
        }

        input[type="text"]:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background-color: #222222;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #222222;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.2);
        }

        input[type="text"]:focus + i.input-icon,
        .input-container:focus-within i.input-icon {
            color: var(--primary-light);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .btn {
            position: relative;
            overflow: hidden;
            padding: 15px 20px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(124, 58, 237, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-glow);
            border: 1.5px solid rgba(6, 182, 212, 0.4);
        }

        .btn-secondary:hover {
            background: rgba(6, 182, 212, 0.3);
            border-color: rgba(6, 182, 212, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 16px;
            display: none;
            text-align: center;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.3);
            position: relative;
            overflow: hidden;
        }

        #result::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .result-label {
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #pair-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin: 0.5rem 0 1rem;
            letter-spacing: 6px;
            padding: 1rem 1.5rem;
            background: #000000;
            border-radius: 12px;
            border: 1px dashed rgba(124, 58, 237, 0.5);
            display: inline-block;
        }

        .result-hint {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .result-hint i {
            color: var(--warning);
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            width: 100%;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.5);
        }

        .error-message {
            color: var(--error);
            margin-top: 0.6rem;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 0.85rem;
            background: rgba(239, 68, 68, 0.15);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .success-message {
            color: var(--success);
            margin-top: 0.75rem;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake {
            animation: shake 0.5s;
        }

        .footer-info {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .footer-info i {
            color: var(--primary-light);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: clamp(1.5rem, 4vw, 1.8rem);
            }
            .container {
                max-width: 520px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 2rem 1.4rem;
                border-radius: 20px;
                margin-top: 70px;
            }
            h1 {
                font-size: clamp(1.3rem, 3.5vw, 1.5rem);
                white-space: normal;
                word-break: break-word;
            }
            #pair-code {
                font-size: 1.5rem;
                letter-spacing: 4px;
                padding: 0.85rem 1.2rem;
            }
            .btn-group {
                grid-template-columns: 1fr;
            }
            .home-btn {
                top: 1rem;
                right: 1rem;
                padding: 0.6rem 1.2rem;
                font-size: 0.85rem;
            }
            .home-btn span {
                display: inline;
            }
            .action-buttons {
                flex-direction: column;
            }
        }

        /* Loading overlay for button */
        .btn-spinner-icon {
            display: none;
            font-size: 1rem;
        }

        .btn-loading .btn-text-label {
            display: none;
        }

        .btn-loading .btn-spinner-icon {
            display: inline-block;
        }
    </style>
</head>
<body>
    <a href="https://chat.whatsapp.com/ELrq5tJUSKu4fATFPJ4OxG" class="home-btn">
        <i class="fab fa-whatsapp"></i>
        <span>Join WhatsApp Channel</span>
    </a>
    
    <div class="container">
        <h1>BMX<span class="gradient-text">BOT</span> Pairing Site</h1>
        <p class="subtitle">Securely link your WhatsApp device in seconds</p>
        
        <div class="form-group">
            <label for="phone-number">
                <i class="fas fa-phone"></i> Phone Number
            </label>
            <div class="input-container">
                <i class="fas fa-comment input-icon"></i>
                <span class="input-prefix">+</span>
                <input type="text" id="phone-number" placeholder="26378000000" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            </div>
            <div class="error-message" id="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span>Please enter a valid phone number (10-15 digits)</span>
            </div>
        </div>
        
        <div class="btn-group">
            <button id="getCodeBtn" class="btn btn-primary">
                <span class="btn-text-label"><i class="fas fa-bolt"></i> Get Code</span>
                <span class="btn-spinner-icon"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
            <a href="/qr" class="btn btn-secondary">
                <i class="fas fa-qrcode"></i> QR Code
            </a>
        </div>
        
        <div id="result">
            <div class="result-label">Your Pairing Code</div>
            <div id="pair-code"></div>
            <div class="result-hint">
                <i class="fas fa-info-circle"></i>
                <span>Code automatically copied to clipboard!</span>
            </div>
            
            <div class="action-buttons">
                <button id="copy-btn" class="action-btn copy-btn">
                    <i class="fas fa-copy"></i> Copy Code
                </button>
            </div>
            
            <div class="success-message" id="success-message">
                <i class="fas fa-check-circle"></i> Code copied to clipboard!
            </div>
        </div>

        <div class="footer-info">
            <i class="fas fa-shield-alt"></i>
            <span>Powered by BMX-BOT • End-to-End Secure</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
        const submitButton = document.getElementById('getCodeBtn');
        const phoneNumberInput = document.getElementById('phone-number');
        const resultDiv = document.getElementById('result');
        const pairCodeDiv = document.getElementById('pair-code');
        const copyButton = document.getElementById('copy-btn');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        function validatePhoneNumber(number) {
            const cleaned = number.replace(/\D/g, '');
            return cleaned.length >= 10 && cleaned.length <= 15;
        }

        submitButton.addEventListener('click', async (e) => {
            e.preventDefault();
            const phoneNumber = phoneNumberInput.value.trim();
            
            if (!validatePhoneNumber(phoneNumber)) {
                errorMessage.style.display = 'flex';
                errorMessage.classList.add('shake');
                setTimeout(() => {
                    errorMessage.classList.remove('shake');
                }, 500);
                return;
            }
            
            errorMessage.style.display = 'none';
            
            submitButton.classList.add('btn-loading');
            submitButton.disabled = true;
            
            try {
                const { data } = await axios.get(`/code?number=${phoneNumber}`);
                const code = data.code || "ERROR";
                
                pairCodeDiv.textContent = code;
                resultDiv.style.display = 'block';
                
                // Auto copy code to clipboard
                try {
                    await navigator.clipboard.writeText(code);
                    successMessage.style.display = 'flex';
                    setTimeout(() => {
                        successMessage.style.display = 'none';
                    }, 3000);
                } catch (clipboardError) {
                    console.error("Auto-copy failed:", clipboardError);
                }
                
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                
            } catch (error) {
                pairCodeDiv.textContent = "SERVICE ERROR";
                resultDiv.style.display = 'block';
                console.error("Error:", error);
            } finally {
                submitButton.classList.remove('btn-loading');
                submitButton.disabled = false;
            }
        });

        copyButton.addEventListener('click', async () => {
            const code = pairCodeDiv.textContent;
            try {
                await navigator.clipboard.writeText(code);
                successMessage.style.display = 'flex';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 2000);
            } catch (error) {
                console.error("Copy failed:", error);
            }
        });

        phoneNumberInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            
            if (errorMessage.style.display === 'flex') {
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
